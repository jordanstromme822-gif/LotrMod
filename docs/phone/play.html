<title>Return of the King</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b0d12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
  /* Layout: a dark game launcher. Setup is one floating card over a glowing backdrop; once the game starts,
     the console takes the whole screen with two small floating controls. Single dark look by design. */
  :root {
    --bg: #0b0d12;
    --panel: rgba(22, 25, 34, 0.78);
    --panel-solid: #161922;
    --line: rgba(255, 255, 255, 0.09);
    --ink: #eef0f5;
    --muted: #9aa1b2;
    --accent: #f08a3c;       /* ember of Mount Doom */
    --accent-ink: #1b0d03;
    --gold: #e8c46a;
    --ok: #7fd49a;
    --bad: #ff8b7b;
    --display: "Cinzel", "Trajan Pro", Georgia, serif;
    --ui: "Manrope", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(70% 55% at 50% 108%, rgba(240, 138, 60, 0.28), transparent 70%),
      radial-gradient(60% 40% at 15% 0%, rgba(90, 110, 170, 0.18), transparent 70%),
      var(--bg);
    color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.5;
    min-height: 100%;
    display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
  }
  .card {
    width: min(100%, 560px);
    background: var(--panel); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--line); border-radius: 20px;
    padding: 28px 24px; display: grid; gap: 24px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
  }
  .brand { display: grid; gap: 6px; }
  .tag { display: inline-flex; width: fit-content; gap: 8px; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
  .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  h1 { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 7vw, 36px); line-height: 1.05; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
  .brand p { margin: 0; color: var(--muted); }

  .field { display: grid; gap: 10px; }
  .rom-row { display: flex; gap: 10px; align-items: stretch; }
  .rom-row .drop { flex: 1; min-width: 0; }
  .rom-row .dl { flex: none; align-self: center; }
  .label { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

  .drop {
    position: relative; display: flex; gap: 14px; align-items: center;
    padding: 16px; border-radius: 14px; border: 1.5px dashed rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.03); cursor: pointer; transition: border-color .2s, background .2s;
  }
  .drop:hover, .drop.drag { border-color: var(--accent); background: rgba(240, 138, 60, 0.07); }
  .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .drop:focus-within { outline: 2px solid var(--gold); outline-offset: 3px; }
  .cart { flex: none; width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.06); }
  .cart svg { width: 24px; height: 24px; stroke: var(--ink); fill: none; stroke-width: 1.6; }
  .drop.ready .cart { background: rgba(127, 212, 154, 0.15); }
  .drop.ready .cart svg { stroke: var(--ok); }
  .drop-text { display: grid; min-width: 0; }
  .drop-text strong { font-weight: 600; }
  .status { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--bad); }

  .mods { display: grid; gap: 8px; }
  .mod {
    position: relative; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center;
    padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.02); cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .mod input { position: absolute; opacity: 0; }
  .mod .dot { grid-row: span 2; width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.25); }
  .mod strong { font-weight: 600; }
  .mod small { color: var(--muted); font-size: 13px; grid-column: 2; }
  .mod:has(input:checked) { border-color: rgba(240, 138, 60, 0.7); background: rgba(240, 138, 60, 0.08); }
  .mod:has(input:checked) .dot { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 45%, transparent 50%); }
  .mod:focus-within { outline: 2px solid var(--gold); outline-offset: 2px; }

  .play {
    font: 700 16px/1 var(--ui); letter-spacing: 0.02em; min-height: 54px; border-radius: 14px; border: 0; cursor: pointer;
    color: var(--accent-ink); background: linear-gradient(180deg, #ffb066, var(--accent));
    box-shadow: 0 10px 30px rgba(240, 138, 60, 0.35); transition: transform .15s, box-shadow .15s, opacity .15s;
  }
  .play:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 14px 36px rgba(240, 138, 60, 0.45); }
  .play:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
  .play:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  #playStatus:empty { display: none; }

  .tips { display: grid; gap: 6px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
  .tips p { margin: 0; }
  kbd { font: 600 11px/1 var(--ui); padding: 3px 6px; border-radius: 5px; background: rgba(255, 255, 255, 0.08); color: var(--ink); border: 1px solid var(--line); }


  .stats-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font: 600 12px/1 var(--ui); padding: 8px 10px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.04); color: var(--ink); cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .stats-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  .stats { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .stats th { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 8px 4px; text-align: center; }
  .stats th:first-child, .stats td:first-child { text-align: left; padding-left: 12px; }
  .stats td { padding: 3px 4px; border-top: 1px solid var(--line); text-align: center; }
  .stats td:first-child { font-weight: 600; white-space: nowrap; }
  .stats input { width: 3.4em; padding: 6px 2px; text-align: center; font: 600 14px/1 var(--ui); color: var(--ink); background: rgba(255,255,255,0.04); border: 1px solid transparent; border-radius: 8px; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
  .stats input::-webkit-outer-spin-button, .stats input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stats input:focus { outline: none; border-color: var(--gold); }
  .stats input.changed { color: var(--accent); background: rgba(240,138,60,0.1); }
  .tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); margin-bottom: 12px; }
  .tabs button { font: 600 13px/1 var(--ui); padding: 9px 16px; border-radius: 9px; border: 0; background: none; color: var(--muted); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: #1a1208; }
  .tabs button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  [role="tabpanel"] { display: flex; flex-direction: column; gap: 10px; }
  [role="tabpanel"][hidden] { display: none; }
  .hero-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .hero-chips .chip[aria-checked="true"] { background: rgba(240,138,60,0.18); border-color: var(--accent); color: var(--accent); }
  .hero-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .hero-list > li { border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,0.02); overflow: hidden; }
  .hero-list > li.open { border-color: var(--accent); }
  .hero-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: none; border: 0; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  .hero-row strong { font-size: 16px; flex: 0 0 auto; }
  .hero-row .sum { color: var(--muted); font-size: 12px; flex: 1; text-align: right; font-variant-numeric: tabular-nums; }
  .hero-row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); visibility: hidden; }
  .hero-row .dot.on { visibility: visible; }
  .hero-row .chev { width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; transition: transform .2s; flex: 0 0 auto; }
  li.open .hero-row .chev { transform: rotate(90deg); }
  .hero-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  .hero-body .tabs { margin: 0; align-self: flex-start; }
  .rows { display: flex; flex-direction: column; }
  .rows .r { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); }
  .rows .r:first-child { border-top: 0; }
  .num { width: 4em; padding: 8px 4px; text-align: center; font: 600 15px/1 var(--ui); color: var(--ink); background: rgba(255,255,255,0.05); border: 1px solid transparent; border-radius: 8px; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
  .num::-webkit-outer-spin-button, .num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .num:focus { outline: none; border-color: var(--gold); }
  .num.changed { color: var(--accent); background: rgba(240,138,60,0.1); }
  .skill { border-top: 1px solid var(--line); }
  .skill:first-child { border-top: 0; }
  .skill-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 11px 0; background: none; border: 0; color: var(--ink); font: 600 14px var(--ui); text-align: left; cursor: pointer; }
  .skill-btn .when { color: var(--muted); font-weight: 500; font-size: 12px; }
  .skill.open .skill-btn { color: var(--accent); }
  .skill-info { padding: 0 0 12px; display: flex; flex-direction: column; gap: 10px; }
  .skill-info p { margin: 0; color: var(--ink); opacity: 0.85; font-size: 13px; line-height: 1.45; }
  .lv { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .lv label { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); font-weight: 600; }
  .lv .num { width: 100%; }
  /* Game stage: fills the whole screen once a game starts */
  #stage { position: fixed; inset: 0; background: #000; z-index: 5; }
  #mpCanvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; image-rendering: pixelated; }
  #mpBanner { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 25; background: rgba(0,0,0,0.7); color: #fff; font: 600 15px var(--ui); padding: 8px 14px; border-radius: 10px; pointer-events: none; max-width: 90%; text-align: center; }
  #mpBanner[hidden] { display: none; }
  #p2Load { position: absolute; inset: 0; z-index: 24; background: #0b0a08; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #f3e6c4; font: 600 16px var(--ui); }
  #p2Load[hidden] { display: none; }
  #p2Load .spin { width: 44px; height: 44px; border-radius: 50%; border: 4px solid rgba(216,178,90,0.25); border-top-color: #d8b25a; animation: p2spin 0.9s linear infinite; }
  @keyframes p2spin { to { transform: rotate(360deg); } }
  #saveNote { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translateX(-50%); z-index: 26; background: rgba(10,8,6,0.85); color: #f3ead6; border: 1px solid rgba(216,178,90,0.6); font: 600 14px var(--ui); padding: 8px 14px; border-radius: 10px; pointer-events: none; max-width: 90%; text-align: center; }
  #saveNote[hidden] { display: none; }
  /* Auto button (Moria): top left, gold when on. */
  #autoBtn { position: absolute; z-index: 28; left: calc(max(env(safe-area-inset-left, 0px), 0px) + 10px); top: calc(env(safe-area-inset-top, 0px) + 10px);
    min-width: 64px; height: 36px; padding: 0 14px; border-radius: 18px; border: 2px solid #d8b25a; background: rgba(14,11,8,0.82); color: #f3ead6;
    font: 700 14px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; box-shadow: 0 0 0 2px rgba(0,0,0,0.6), 0 0 12px rgba(240,170,80,0.3);
    touch-action: none; -webkit-user-select: none; user-select: none; cursor: pointer; }
  #autoBtn.on { background: radial-gradient(circle at 50% 40%, #8a6020 0%, #4a3010 70%); color: #fff6dc; border-color: #f6dc94; box-shadow: 0 0 0 2px rgba(0,0,0,0.6), 0 0 18px rgba(255,190,90,0.8); }
  #autoBtn[hidden] { display: none; }
  #pad .b-qs.full { color: #d8a0a0; }
  /* P2 button (Jordan, 2026-11-08): next to Auto, gold while P2 plays; its hero list opens under it. */
  #p2Btn { position: absolute; z-index: 28; left: calc(max(env(safe-area-inset-left, 0px), 0px) + 84px); top: calc(env(safe-area-inset-top, 0px) + 10px);
    min-width: 52px; height: 36px; padding: 0 12px; border-radius: 18px; border: 2px solid #d8b25a; background: rgba(14,11,8,0.82); color: #f3ead6;
    font: 700 14px/1 var(--display); letter-spacing: 0.08em; box-shadow: 0 0 0 2px rgba(0,0,0,0.6), 0 0 12px rgba(240,170,80,0.3);
    touch-action: none; -webkit-user-select: none; user-select: none; cursor: pointer; }
  #p2Btn.on { background: radial-gradient(circle at 50% 40%, #8a6020 0%, #4a3010 70%); color: #fff6dc; border-color: #f6dc94; box-shadow: 0 0 0 2px rgba(0,0,0,0.6), 0 0 18px rgba(255,190,90,0.8); }
  #p2Btn[hidden] { display: none; }
  /* Levels button (Jordan, 2026-11-09): next to P2 in the pause menu; picking a level takes you (and P2) there. */
  #lvBtn { position: absolute; z-index: 28; left: calc(max(env(safe-area-inset-left, 0px), 0px) + 84px); top: calc(env(safe-area-inset-top, 0px) + 10px);
    min-width: 64px; height: 36px; padding: 0 12px; border-radius: 18px; border: 2px solid #d8b25a; background: rgba(14,11,8,0.82); color: #f3ead6;
    font: 700 14px/1 var(--display); letter-spacing: 0.08em; box-shadow: 0 0 0 2px rgba(0,0,0,0.6), 0 0 12px rgba(240,170,80,0.3);
    touch-action: none; -webkit-user-select: none; user-select: none; cursor: pointer; }
  #lvBtn[hidden] { display: none; }
  #p2Pick .lv-group, #mpPick .lv-group { font: 700 13px var(--ui); letter-spacing: 0.06em; text-transform: uppercase; color: #d8b25a; margin-top: 4px; }
  /* Save page button (Jordan, 2026-11-08: a second page of save slots, 8 in total): top left on the save slot screens. */
  #pageBtn { position: absolute; z-index: 28; left: calc(max(env(safe-area-inset-left, 0px), 0px) + 10px); top: calc(env(safe-area-inset-top, 0px) + 10px);
    min-width: 96px; height: 36px; padding: 0 14px; border-radius: 18px; border: 2px solid #d8b25a; background: rgba(14,11,8,0.82); color: #f3ead6;
    font: 700 14px/1 var(--display); letter-spacing: 0.06em; box-shadow: 0 0 0 2px rgba(0,0,0,0.6), 0 0 12px rgba(240,170,80,0.3);
    touch-action: none; -webkit-user-select: none; user-select: none; cursor: pointer; }
  #pageBtn[hidden] { display: none; }
  /* Story map (Jordan, 2026-11-09) */
  #mapBtn { position: absolute; z-index: 28; left: calc(max(env(safe-area-inset-left, 0px), 0px) + 10px); top: calc(env(safe-area-inset-top, 0px) + 10px);
    min-width: 96px; height: 36px; padding: 0 14px; border-radius: 18px; border: 2px solid #d8b25a; background: rgba(14,11,8,0.82); color: #f3ead6;
    font: 700 14px/1 var(--display); letter-spacing: 0.06em; box-shadow: 0 0 0 2px rgba(0,0,0,0.6), 0 0 12px rgba(240,170,80,0.3);
    touch-action: none; -webkit-user-select: none; user-select: none; cursor: pointer; }
  #mapBtn[hidden] { display: none; }
  #storyMap { position: fixed; inset: 0; z-index: 60; background: #121318; color: #ecebe6; display: flex; flex-direction: column; font: 13px/1.2 var(--ui, system-ui, sans-serif);
    padding: calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-right, 0px) + 12px) 10px calc(env(safe-area-inset-left, 0px) + 12px); }
  #storyMap .sm-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-bottom: 10px; }

  #storyMap .sm-grid { display: grid; gap: 6px; grid-auto-rows: 118px; width: max-content; }

  #storyMap .sm-b b { font-weight: 600; font-size: 11.5px; line-height: 1.1; }
  #storyMap .sm-b i { font-style: normal; font-size: 9px; opacity: 0.8; margin-top: 1px; line-height: 1.1; }
  #storyMap .sm-b i.sm-m { opacity: 1; font-weight: 700; color: #f3d98e; letter-spacing: 0.04em; margin: 0 0 1px; text-transform: uppercase; font-size: 8.5px; }

  #storyMap .sm-b i.sm-big { opacity: 1; font-weight: 700; font-size: 10.5px; margin-top: 2px; }
  #storyMap .sm-b[data-l] { cursor: pointer; }

  #smPic { position: absolute; inset: 0; z-index: 2; background: #0b0c10; display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); }
  #smPic .smp-bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; flex: none; }

  #smPic .smp-bar span { color: #a9a79f; font-size: 12px; flex: 1; }

  #smPic .smp-wrap { flex: 1; overflow: auto; display: grid; place-items: center; padding: 8px; -webkit-overflow-scrolling: touch; cursor: grab; }

  #smPic .smp-msg { color: #a9a79f; font-size: 14px; }
  #storyMap .sg { display: flex; flex-direction: column; gap: 10px; }
  #storyMap .sg-top { position: sticky; top: 0; left: 0; z-index: 1; background: #121318; padding-bottom: 2px; box-shadow: 0 6px 10px -6px rgba(0,0,0,0.7); }
  #storyMap .sg-hint { font-size: 13px; color: #d8d5cb; }

  #storyMap .sg-card { flex: none; width: 150px; scroll-snap-align: start; display: flex; flex-direction: column; align-items: stretch; gap: 2px; padding: 4px; border-radius: 8px; border: 1px solid #3a3d4a; background: #1e2028; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  #storyMap .sg-card.used { opacity: 0.45; }
  #storyMap .sg-card b { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #storyMap .sg-card i { font-style: normal; font-size: 10px; color: #a9a79f; }
  #storyMap .sg-img { position: relative; display: block; height: 96px; background: #0b0c10; border-radius: 5px; overflow: hidden; }
  #storyMap .sg-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
  #storyMap .sg-img em { position: absolute; left: 0; right: 0; bottom: 0; font-style: normal; font-size: 10.5px; font-weight: 600; text-align: center; padding: 2px 0; background: rgba(0,0,0,0.72); color: #f3d98e; }

  #storyMap .sg-slot.spec { background: #1f2330; }

  #storyMap .sg-slot b { font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Pause menu (Jordan, 2026-11-08): P2 at the top left, Auto under it (Moria). */

  #autoBtn { top: calc(env(safe-area-inset-top, 0px) + 56px); }

    width: min(280px, calc(100% - 20px)); max-height: calc(100% - 70px); overflow-y: auto; padding: 12px; border-radius: 12px; border: 2px solid #d8b25a;
    background: rgba(14,11,8,0.94); color: #f3ead6; font: 600 14px var(--ui); box-shadow: 0 6px 24px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 8px; }

  .mp-note { margin: 4px 0 6px; font-size: 14px; opacity: 0.85; }
  #game { position: absolute; inset: 0; }
  body.playing .card { display: none; }
  /* No emulator menus in game: hide the three-bar button and the bottom toolbar. */
  #game .ejs_virtualGamepad_open, #game .ejs_menu_bar { display: none !important; }
  /* Shown when the phone blocks the game from starting until a tap. */
  /* Black cover over the GBA's white power-on screen; fades away once the title is up. */
  #bootCover { position: absolute; inset: 0; z-index: 20; background: #000; pointer-events: none; transition: opacity 0.4s ease; }
  #bootCover.gone { opacity: 0; }
  #tapStart { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(0,0,0,0.6); color: #fff; font: 600 20px var(--ui); border: 0; width: 100%; }
  #tapStart[hidden] { display: none; }
  /* Touch controls (our own, so every button sits exactly where we want it). Hidden on PC.

  #game .ejs_virtualGamepad_parent { display: none !important; }
  body.touch #stage { --g1: #d8b25a; --g2: #f6dc94; --g3: #7a5a22;
    background: radial-gradient(90% 45% at 50% 100%, rgba(240,150,60,0.14), transparent 70%), radial-gradient(70% 40% at 50% 0%, rgba(80,70,120,0.18), transparent 70%), #08070a; }
  #pad { position: absolute; inset: 0; z-index: 25; pointer-events: none; display: none; }
  body.touch #pad { display: block; }
  #topArt, #deckLine { display: none; position: absolute; pointer-events: none; }
  /* No text selection, magnifier or callout while playing (iOS shows a magnifier on a long press). */

  body.playing #game, body.playing #pad { touch-action: none; }
  #pad > * { pointer-events: auto; position: absolute; touch-action: none; -webkit-user-select: none; user-select: none; }
  #pad .btn { box-sizing: border-box; display: grid; place-items: center; color: #f3ead6; font: 700 18px var(--display); letter-spacing: 0.02em;
    text-shadow: 0 1px 2px #000, 0 0 8px rgba(255,210,140,0.25);
    background: radial-gradient(circle at 50% 30%, #2f2922 0%, #16120f 58%, #0a0807 100%);
    border: 2px solid var(--g1);
    box-shadow: 0 0 0 3px #0d0b09, 0 0 0 4.5px rgba(216,178,90,0.5), 0 0 16px rgba(240,170,80,0.28),
      inset 0 1px 0 rgba(255,240,200,0.2), inset 0 -8px 14px rgba(0,0,0,0.55);
    transition: transform 0.06s, box-shadow 0.06s, background 0.06s; }
  #pad .btn.on { transform: scale(0.95); border-color: var(--g2); color: #fff6dc;
    background: radial-gradient(circle at 50% 40%, #7a5420 0%, #3a2610 62%, #1a1108 100%);
    box-shadow: 0 0 0 3px #0d0b09, 0 0 0 4.5px rgba(246,220,148,0.9), 0 0 26px rgba(255,190,90,0.7), inset 0 0 14px rgba(255,200,110,0.35); }
  #pad .round { width: 64px; height: 64px; border-radius: 50%; font-size: 28px; }
  #pad .pill { width: 54px; height: 32px; border-radius: 12px; font-size: 12px; }
  #pad .shoulder { width: 64px; height: 42px; border-radius: 14px; font-size: 18px; }
  #pad .b-st { background: radial-gradient(120% 140% at 50% 20%, #4a3416 0%, #22180b 60%, #120c06 100%); border-color: var(--g2);
    box-shadow: 0 0 0 3px #0d0b09, 0 0 0 4.5px rgba(246,220,148,0.65), 0 0 20px rgba(255,180,80,0.45), inset 0 1px 0 rgba(255,240,200,0.25), inset 0 -8px 14px rgba(0,0,0,0.5); }

  #pad .sk.show { display: block; }
  /* Extra skill buttons above A and B (Jordan, 2026-11-07): learned skills that aren't on A, B or R. First one above A,
     second above B, third between them. Each shows the skill's own icon and uses the skill once per tap. */
  #pad .btn.xs { display: none; width: var(--xs, 46px); height: var(--xs, 46px); border-radius: 50%; padding: 0; font-size: 0; }
  #pad .btn.xs.show { display: grid; }
  #pad .xs .xi { --iw: calc(var(--xs, 46px) * 0.8); --ih: calc(var(--xs, 46px) * 0.667); width: var(--iw); height: var(--ih); border-radius: 50%;
    background-repeat: no-repeat; background-size: calc(var(--iw) * 6) calc(var(--ih) * 8); image-rendering: pixelated; pointer-events: none; }
  body.qs-on #pad .sk { opacity: 1; box-shadow: 0 0 0 1.5px #0b0908, 0 0 0 2.5px var(--g2), 0 0 12px rgba(255,190,90,0.8); }
  /* Skill icons inside their buttons, filling them (Jordan, 2026-11-08). The sheet is 6 x 8 icons, placed by percent. With
     Quick Skill off the icon is dimmed and the button's letter shows over it; with Quick Skill on the icon is full and the
     letter hides. A skill that's been used turns black, with a countdown while a skill that lasts a while is active. */
  #pad .btn.has-sk, #pad .btn.xs { overflow: hidden; }
  #pad .btn .sk, body.qs-on #pad .btn .sk, #pad .xs .xi { position: absolute; left: 50%; top: 50%; width: auto; height: 100%; aspect-ratio: 6 / 5; margin: 0;
    transform: translate(-50%, -50%); border-radius: 0; box-shadow: none; background-size: 600% 800%; z-index: 0; transition: filter 0.15s; }
  #pad .btn .sk { opacity: 0.4; }
  body.qs-on #pad .btn .sk { opacity: 1; }
  #pad .btn.has-sk { isolation: isolate; text-shadow: 0 0 4px #000, 0 0 2px #000; }
  #pad .btn.has-sk > :not(.sk):not(.cd) { position: relative; z-index: 1; }
  /* Letters stay in front of the icons (Jordan, 2026-11-08); the L and R icons stretch to fill their wide buttons. */
  body.qs-on #pad .btn.shoulder .sk, #pad .btn.shoulder .sk { width: 100%; height: 100%; aspect-ratio: auto; }
  /* Not enough Spirit for the skill: its icon goes grey. */

.ejs_settings_parent::before,

    width: 0;
    height: 0;
    content: '';
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-top-width: 5px;
    border-top-style: solid;
}

.ejs_settings_parent::before {
    top: calc(100% + 1px);
    border-top-color: rgba(49, 49, 49, 0.9);
}

.ejs_settings_parent::after {
    top: 100%;

}

    { cou: 30, def: 28, hea: 18, acc: 21, str: 16 },
    { cou: 20, def: 22, hea: 20, acc: 30, str: 18 },
    { cou: 20, def: 24, hea: 22, acc: 23, str: 23 },

    { cou: 25, def: 20, hea: 24, acc: 25, str: 18 },

  const ROTK_ENHANCE_GLSL = `/*
	Return of the King Play Room: scene enhance pass (runs on the game's own pixels, before SABR).
	- Environment: gentle vibrance, local contrast (unsharp mask) and a little depth in the shadows.

#if __VERSION__ >= 130
#define COMPAT_VARYING out
#define COMPAT_ATTRIBUTE in
#else
#define COMPAT_VARYING varying
#define COMPAT_ATTRIBUTE attribute

COMPAT_ATTRIBUTE vec4 TexCoord;
COMPAT_VARYING vec4 COL0;
COMPAT_VARYING vec4 TEX0;
uniform mat4 MVPMatrix;
void main()
{

float luma(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }

{

  async function startLinked(mp, game) {

      const queued = (rw - rr + cap) % cap; if (queued > rate * 0.2) return; // too far ahead: drop rather than lag

      const p = M._lk_video(me);

      for (let i = 0; i < px.length; i++) px[i] |= 0xff000000;
      g2d.putImageData(img, 0, 0);
    };

    // for the usual emulator, so they work the same as in solo play.
    let held = 0, qsWant = false, frame = 0, sent = -1;
    const mine = new Map(), theirs = new Map(), myHash = new Map(); let theirHash = null, peerSeen = false, gone = false;
    const fake = {
      started: true,
      Module: { get HEAPU8() { return M.HEAPU8; }, AL: null },
      gameManager: {
        simulateInput: (p, id, v) => { const b = LIBRETRO_TO_GBA[id]; if (!b) return; held = v ? (held | b) : (held & ~b); },
        getFrameNum: () => frame,
        saveSaveFiles: () => {},
        getSaveFile: () => { const p = M._lk_save(me), n = M._lk_save_len(); const out = M.HEAPU8.slice(p, p + n); M._lk_free(p); return out; },
        getSaveFilePath: () => "", loadSaveFiles: () => {}, restart: () => {}, setVariable: () => {},
        toggleFastForward: () => {}, setFastForwardRatio: () => {},
        mpQs: () => { qsWant = true; },
      },
      changeSettingOption: () => {}, enableShader: () => {}, play: () => {},
    };
    window.__mp = { iwram: () => M._lk_iwram(me), frame: () => frame, M, net: () => ({ rtt: Math.round(rtt), delay }) };
    window.EJS_emulator = fake;
    try { window.EJS_onGameStart(); } catch (e) {}
    // Keyboard (PC): same keys as solo play.
    const KEYS = { ArrowUp: 4, ArrowDown: 5, ArrowLeft: 6, ArrowRight: 7, z: 8, x: 0, Enter: 3, v: 2, q: 10, e: 11 };
    const key = (e, v) => {
      let id = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key]; if (id === undefined) return; e.preventDefault();

    const theirRole = me ? "h" : "g";
    room.onPeers(() => {
      const p = room.peers().find((q) => !q.sameTab && q.presence && q.presence.role === theirRole);
      if (!p) { if (peerSeen && !gone) { gone = true; say("Your friend left the game."); } return; }
      peerSeen = true;
      const pr = p.presence;
      if (typeof pr.f === "number" && Array.isArray(pr.k)) {
        const from = pr.f - pr.k.length + 1;
        for (let i = 0; i < pr.k.length; i++) if (from + i >= frame && !theirs.has(from + i)) theirs.set(from + i, pr.k[i] | 0);
      }
      if (pr.hs && typeof pr.hs.f === "number") theirHash = pr.hs;
      if (typeof pr.pi === "number") echo = pr.pi;
      if (typeof pr.po === "number" && pr.po === pingId && pingAt) { const r = performance.now() - pingAt; rtt = rtt ? rtt * 0.7 + r * 0.3 : r; pingAt = 0; }
    });

    let lastPub = 0, hs = null, echo = null, pingId = 0, pingAt = 0, lastPing = 0, rtt = 0, delay = MP.delay;

      if (now - lastPub < 30) return; lastPub = now;

      else if (pingAt && now - pingAt > 3000) pingAt = 0;

        frame++; acc -= step; ran++;

      else if (!gone) { if (!waitSince) waitSince = now; else if (now - waitSince > 1500) say("Waiting for your friend…"); }
      if (theirHash && myHash.has(theirHash.f)) { if (myHash.get(theirHash.f) !== theirHash.h && !gone) say("Your games fell out of step. Both of you reload the page and link up again."); theirHash = null; }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  if (matchMedia("(pointer: coarse)").matches || "ontouchstart" in window) document.body.classList.add("touch");
  // Classic fills the game area too (Jordan, 2026-11-08: "stretch Classic"). The emulator keeps the GBA's 3:2 shape and
  // centres it in its canvas; stretching the canvas by the size of the black bars makes the picture fill the area.
  const fitClassic = () => {
    const g = $("game"), c = g && g.querySelector("canvas.ejs_canvas");
    if (!c || document.body.classList.contains("wide-view")) return;

  };

    const el = document.documentElement;

    try {
